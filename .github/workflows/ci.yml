# CI + GitHub Pages.
#   check:  typecheck · unit tests · self-check (the explorer evaluates .gitlab-ci.yml)
#   build:  static web bundle → Pages artifact
#   deploy: GitHub Pages (default branch only)
# One-time setup: Settings → Pages → Source: "GitHub Actions".

name: ci

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: self-check
        run: |
          npm run -s gce -w @gce/core -- "$GITHUB_WORKSPACE/.gitlab-ci.yml" --matrix
          npm run -s gce -w @gce/core -- "$GITHUB_WORKSPACE/.gitlab-ci.yml" --preset mr

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @gce/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
