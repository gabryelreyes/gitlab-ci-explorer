# CI for gitlab-ci-explorer (GitLab Free, self-hosted).
#   check:   typecheck · unit tests (JUnit) · self-check (the explorer evaluates this file)
#   build:   static web bundle (artifact)
#   package: container image (buildah, no privileged runner); pushed on default branch and tags
#
# Internal CA: add a File-type CI/CD variable INTERNAL_CA (PEM). Falls back to the runner's
# CI_SERVER_TLS_CA_FILE. Used by Node (npm) and by buildah (registry).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS   # no duplicate branch pipeline while an MR is open
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages: [check, build, package]

default:
  interruptible: true

variables:
  NODE_IMAGE: node:26-bookworm-slim
  IMAGE: $CI_REGISTRY_IMAGE

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push
  before_script:
    - CA="${INTERNAL_CA:-${CI_SERVER_TLS_CA_FILE:-}}"; if [ -n "$CA" ]; then export NODE_EXTRA_CA_CERTS="$CA"; fi
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

typecheck:
  extends: .node
  stage: check
  script:
    - npm run typecheck

test:
  extends: .node
  stage: check
  script:
    - npm test --workspaces --if-present -- --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: packages/*/junit.xml

# The explorer evaluates this pipeline for every pipeline type (smoke test of the CLI).
self-check:
  extends: .node
  stage: check
  script:
    - npm run -s gce -w @gce/core -- "$CI_PROJECT_DIR/.gitlab-ci.yml" --matrix
    - npm run -s gce -w @gce/core -- "$CI_PROJECT_DIR/.gitlab-ci.yml" --preset mr

web:
  extends: .node
  stage: build
  needs: []
  script:
    - npm run build -w @gce/web
  artifacts:
    name: gitlab-ci-explorer-web-$CI_COMMIT_SHORT_SHA
    expire_in: 1 week
    paths: [packages/web/dist/]

container-image:
  stage: package
  image: quay.io/buildah/stable:v1.39
  needs: [typecheck, test]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  rules:
    - if: $CI_COMMIT_TAG
      variables: {PUSH: "true", TAGS: "$CI_COMMIT_TAG latest"}
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: {PUSH: "true", TAGS: "$CI_COMMIT_REF_SLUG $CI_COMMIT_SHORT_SHA"}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"   # MR: verify the image still builds (no push)
      changes: [Dockerfile, .dockerignore, package-lock.json]
      variables: {PUSH: "false", TAGS: "$CI_COMMIT_SHORT_SHA"}
  before_script:
    - |
      CA="${INTERNAL_CA:-${CI_SERVER_TLS_CA_FILE:-}}"
      if [ -n "$CA" ] && [ -n "${CI_REGISTRY:-}" ]; then
        mkdir -p "/etc/containers/certs.d/$CI_REGISTRY"
        cp "$CA" "/etc/containers/certs.d/$CI_REGISTRY/ca.crt"
      fi
  script:
    - buildah build --layers=false -t "$IMAGE:build" .
    - |
      if [ "$PUSH" = "true" ]; then
        echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        for t in $TAGS; do
          buildah tag "$IMAGE:build" "$IMAGE:$t"
          buildah push "$IMAGE:$t"
        done
      fi
