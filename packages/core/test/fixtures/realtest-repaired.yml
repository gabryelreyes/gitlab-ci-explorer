# CI-relevant structure of realtest/.gitlab-ci.yml (whose indentation was flattened).
# Scripts are stubbed; rules/needs/stages/extends/variables are kept as in the original.
stages: [".pre", check, build, test, docs, deploy, ".post"]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

".if_main":
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
".if_develop":
  if: $CI_COMMIT_BRANCH == "develop"
".if_tag":
  if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"

variables:
  G_DOXYGEN_WARN_LOG:
    value: DoxygenWarnings_${CI_COMMIT_SHORT_SHA}_${CI_JOB_NAME_SLUG}.txt

".doxygen-template":
  stage: docs
  variables:
    DOXYGEN_APPLICATION_FOLDER: "./SDD/"
    DOXYGEN_CONFIG_PATH: Doxyfile
  image: doxygen
  retry:
    max: 2
    when: runner_system_failure
  script: [doxygen doxyfile.config]

create_confluence_blog_entry:
  image: alpine:latest
  stage: deploy
  script: [post-blog]
  needs:
    - job: read_release
  rules:
    - if: $GP_CONFLUENCE_BLOG_ENTRY_ENABLE != "true"
      when: never
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"

create_jira_issue:
  stage: deploy
  script: [create-issue]
  needs:
    - job: read_release
  rules:
    - if: $GP_JIRA_ISSUE_ENABLE != "true"
      when: never
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"

clang_format_check:
  stage: check
  dependencies: []
  variables:
    GP_ENABLE_CLANG_FORMAT_CHECK: 'true'
  rules:
    - if: $GP_ENABLE_CLANG_FORMAT_CHECK != "true"
      when: never
    - when: on_success
  script: [clang-format]

project_init_check:
  stage: check
  dependencies: []
  rules:
    - when: on_success
  script: [project_init --check]

doxygen-job_Check_Code:
  stage: check
  extends: ".doxygen-template"
  script: [doxygen-check]
  rules:
    - when: on_success

unit_test:
  stage: test
  needs: []
  rules:
    - when: on_success
  script: [ceedling]
  coverage: "/TOTAL Line Coverage: (\\d+\\.\\d+)%/"

doxygen-job_generateDocumentation:
  extends: ".doxygen-template"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"

pages:
  stage: deploy
  needs: [doxygen-job_generateDocumentation]
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: $CI_COMMIT_BRANCH == "develop"
  script: [deploy-pages]
  pages: true

release_pages:
  stage: deploy
  needs: [doxygen-job_generateDocumentation]
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"
  pages: true
  script: [deploy-release-pages]

root_page:
  stage: deploy
  needs:
    - job: pages
      optional: true
    - job: release_pages
      optional: true
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"
  resource_group: gl-pages
  pages: true
  script: [root-page]

read_release:
  stage: deploy
  needs:
    - job: root_page
      optional: true
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/"
  script: [read-release]
